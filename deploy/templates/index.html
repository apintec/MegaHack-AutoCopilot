<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业视觉检测AI专家</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --thinking-bg: #1a365d;
            --thinking-border: #3b82f6;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .header-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        
        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .new-chat-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .new-chat-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .chat-history-item {
            padding: 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .chat-history-item:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        
        .chat-history-item.active {
            background: var(--primary);
            color: white;
        }
        
        .chat-history-item i {
            font-size: 16px;
            flex-shrink: 0;
        }
        
        /* Skills Section */
        .skills-section {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        
        .skills-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .skill-btn {
            aspect-ratio: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }
        
        .skill-btn:hover {
            background: var(--border);
            transform: scale(1.05);
        }
        
        .skill-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .skill-btn span {
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }
        
        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        
        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 500px;
            line-height: 1.6;
        }
        
        .example-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 32px;
            justify-content: center;
        }
        
        .example-prompt {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-prompt:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        /* Message */
        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        }
        
        .message.assistant .message-avatar {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-text {
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .message.user .message-text {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-text {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        
        /* Thinking Section */
        .thinking-container {
            background: var(--thinking-bg);
            border: 1px solid var(--thinking-border);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .thinking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid var(--thinking-border);
            font-size: 13px;
            font-weight: 500;
            color: var(--primary-light);
        }
        
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
        }
        
        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .thinking-dots span:nth-child(1) { animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .thinking-content {
            padding: 16px;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        /* Thinking in progress animation */
        .thinking-container.streaming .thinking-header .thinking-dots {
            display: inline-flex;
        }
        
        .thinking-container.idle .thinking-header .thinking-dots {
            display: none;
        }
        
        /* Input Area */
        .input-area {
            padding: 16px 24px 24px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border);
        }
        
        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .image-preview-container {
            display: none;
            padding: 0 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .image-preview-container.active {
            display: block;
            margin-bottom: 8px;
        }
        
        .image-preview {
            position: relative;
            display: inline-block;
        }
        
        .image-preview img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 12px;
            border: 2px solid var(--border);
        }
        
        .image-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--error);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .input-box {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            transition: all 0.2s;
        }
        
        .input-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .input-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            padding: 12px;
            resize: none;
            max-height: 150px;
            min-height: 48px;
            line-height: 1.5;
            font-family: inherit;
        }
        
        .input-textarea:focus {
            outline: none;
        }
        
        .input-textarea::placeholder {
            color: var(--text-secondary);
        }
        
        .input-actions {
            display: flex;
            gap: 4px;
            padding: 4px;
        }
        
        .input-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }
        
        .input-btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        
        .input-btn.attach-btn {
            color: var(--primary);
        }
        
        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            background: var(--primary-dark);
        }
        
        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
        
        .input-file {
            display: none;
        }
        
        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
        
        /* Stats */
        .thinking-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 0 16px;
        }
        
        .thinking-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Mobile */
        .mobile-menu-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 60px;
                bottom: 0;
                z-index: 99;
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .messages-container {
                padding: 16px;
            }
            
            .input-area {
                padding: 12px 16px 16px;
            }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        
        /* Thinking process tags */
        .thinking-content .thinking-tag {
            color: var(--warning);
            font-weight: 500;
        }
        
        /* Code blocks in messages */
        .message-text pre {
            background: #0d1117;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 13px;
        }
        
        .message-text code {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
        }
        
        .message-text pre code {
            background: transparent;
            padding: 0;
        }
        
        .message-text :not(pre) > code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="ri-menu-line"></i>
            </button>
            <div class="logo-icon">
                <i class="ri-robot-line"></i>
            </div>
            <span class="logo-text">工业视觉检测AI专家</span>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="clearHistory()">
                <i class="ri-delete-bin-line"></i>
                清空历史
            </button>
            <button class="header-btn" onclick="showHelp()">
                <i class="ri-question-line"></i>
            </button>
        </div>
    </header>
    
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newChat()">
                    <i class="ri-add-line"></i>
                    新建对话
                </button>
            </div>
            <div class="chat-history" id="chatHistory">
                <!-- Chat history items will be inserted here -->
            </div>
            <div class="skills-section">
                <div class="skills-title">快捷工具</div>
                <div class="skills-grid">
                    <button class="skill-btn" data-skill="camera" onclick="insertSkill('camera')" title="相机选型">
                        📷
                        <span>相机</span>
                    </button>
                    <button class="skill-btn" data-skill="light" onclick="insertSkill('light')" title="光源选型">
                        💡
                        <span>光源</span>
                    </button>
                    <button class="skill-btn" data-skill="code" onclick="insertSkill('code')" title="代码生成">
                        💻
                        <span>代码</span>
                    </button>
                    <button class="skill-btn" data-skill="scheme" onclick="insertSkill('scheme')" title="方案设计">
                        📋
                        <span>方案</span>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Chat Area -->
        <main class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <!-- Welcome screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <i class="ri-robot-line"></i>
                    </div>
                    <h1 class="welcome-title">工业视觉检测AI专家</h1>
                    <p class="welcome-subtitle">
                        专注于工业视觉检测领域的智能助手，提供相机选型、光源配置、
                        代码生成、缺陷检测等全方位技术支持
                    </p>
                    <div class="example-prompts">
                        <div class="example-prompt" onclick="sendExample('帮我推荐一个检测连接器引脚的项目，需要500万像素，检测精度0.05mm')">
                            连接器引脚检测方案
                        </div>
                        <div class="example-prompt" onclick="sendExample('生成一个Vap SDK的模板匹配代码')">
                            Vap SDK代码生成
                        </div>
                        <div class="example-prompt" onclick="sendExample('分析这个缺陷是什么原因导致的')">
                            缺陷分析
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Image Preview -->
            <div class="image-preview-container" id="imagePreviewContainer">
                <div class="image-preview">
                    <img id="imagePreview" src="" alt="Preview">
                    <div class="image-remove" onclick="removeImage()">
                        <i class="ri-close-line"></i>
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <div class="input-box">
                        <textarea 
                            class="input-textarea" 
                            id="messageInput" 
                            placeholder="输入您的工业视觉检测问题..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <div class="input-actions">
                            <button class="input-btn attach-btn" onclick="triggerFileInput()" title="上传图片">
                                <i class="ri-image-add-line"></i>
                            </button>
                            <input type="file" class="input-file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                        </div>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <i class="ri-send-plane-fill"></i>
                        发送
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // State
        let chatHistory = [];
        let currentImage = null;
        let isStreaming = false;
        let abortController = null;
        let thinkingElement = null;
        let thinkingContent = '';
        let answerContent = '';
        
        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const fileInput = document.getElementById('fileInput');
        const chatHistoryEl = document.getElementById('chatHistory');
        const sidebar = document.getElementById('sidebar');
        
        // Initialize
        loadHistory();
        messageInput.focus();
        
        // Auto-resize textarea
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }
        
        // Toggle sidebar on mobile
        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }
        
        // Handle keyboard
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        // Trigger file input
        function triggerFileInput() {
            fileInput.click();
        }
        
        // Handle file selection
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImage = event.target.result;
                    imagePreview.src = currentImage;
                    imagePreviewContainer.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        }
        
        // Remove image
        function removeImage() {
            currentImage = null;
            imagePreview.src = '';
            imagePreviewContainer.classList.remove('active');
            fileInput.value = '';
        }
        
        // Insert skill prompt
        function insertSkill(skill) {
            const prompts = {
                camera: '请推荐一款适合以下场景的工业相机：\n- 检测内容：\n- 检测精度：\n- 检测速度：',
                light: '请推荐光源方案：\n- 检测对象：\n- 工作距离：\n- 检测要求：',
                code: '请生成Vap SDK/InteVega SDK检测代码：\n- 检测类型：\n- 算法要求：\n- 相机型号：',
                scheme: '请设计完整的视觉检测方案：\n- 产品信息：\n- 检测需求：\n- 精度要求：'
            };
            messageInput.value = prompts[skill] || '';
            messageInput.focus();
        }
        
        // Send example prompt
        function sendExample(text) {
            messageInput.value = text;
            sendMessage();
        }
        
        // New chat
        function newChat() {
            chatHistory = [];
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(welcomeScreen.cloneNode(true));
            welcomeScreen.style.display = 'flex';
            messageInput.value = '';
            removeImage();
            updateChatHistoryUI();
            sidebar.classList.remove('open');
        }
        
        // Clear history
        function clearHistory() {
            if (confirm('确定要清空所有对话历史吗？')) {
                localStorage.removeItem('vision_ai_history');
                newChat();
            }
        }
        
        // Load history from localStorage
        function loadHistory() {
            try {
                const saved = localStorage.getItem('vision_ai_history');
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    updateChatHistoryUI();
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }
        
        // Save history
        function saveHistory() {
            try {
                // 只保存最近20条对话
                const toSave = chatHistory.slice(-20);
                localStorage.setItem('vision_ai_history', JSON.stringify(toSave));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }
        
        // Update chat history UI
        function updateChatHistoryUI() {
            chatHistoryEl.innerHTML = '';
            chatHistory.slice(-10).reverse().forEach((item, idx) => {
                const actualIdx = chatHistory.length - 1 - idx;
                const div = document.createElement('div');
                div.className = 'chat-history-item';
                div.innerHTML = `<i class="ri-message-3-line"></i><span>${escapeHtml(item.preview || item.content.substring(0, 30))}</span>`;
                div.onclick = () => loadChat(actualIdx);
                chatHistoryEl.appendChild(div);
            });
        }
        
        // Load specific chat
        function loadChat(index) {
            // 实现历史对话加载
            sidebar.classList.remove('open');
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Send message
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content && !currentImage) return;
            if (isStreaming) return;
            
            // Hide welcome screen
            const welcome = messagesContainer.querySelector('.welcome-screen');
            if (welcome) {
                welcome.remove();
            }
            
            // Create user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
                <div class="message-avatar">
                    <i class="ri-user-line"></i>
                </div>
                <div class="message-content">
                    <div class="message-text">${escapeHtml(content)}${currentImage ? '<br><img src="' + currentImage + '" style="max-width:200px;margin-top:8px;border-radius:8px;">' : ''}</div>
                </div>
            `;
            messagesContainer.appendChild(userMsg);
            
            // Save to history
            chatHistory.push({
                role: 'user',
                content: content,
                preview: content.substring(0, 30)
            });
            
            // Clear input
            messageInput.value = '';
            autoResize(messageInput);
            removeImage();
            
            // Create assistant message container
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'message assistant';
            assistantMsg.innerHTML = `
                <div class="message-avatar">
                    <i class="ri-robot-line"></i>
                </div>
                <div class="message-content">
                    <div class="thinking-container idle" id="thinkingContainer">
                        <div class="thinking-header">
                            <span>🧠 思考过程</span>
                            <div class="thinking-dots">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                        <div class="thinking-content" id="thinkingContent"></div>
                    </div>
                    <div class="message-text" id="answerContent"></div>
                </div>
            `;
            messagesContainer.appendChild(assistantMsg);
            
            // Scroll to bottom
            scrollToBottom();
            
            // Disable input
            setInputEnabled(false);
            isStreaming = true;
            thinkingElement = assistantMsg;
            thinkingContent = '';
            answerContent = '';
            
            // Show thinking section
            const thinkingContainer = document.getElementById('thinkingContainer');
            const thinkingContentEl = document.getElementById('thinkingContent');
            thinkingContainer.classList.remove('idle');
            thinkingContainer.classList.add('streaming');
            
            // Start streaming
            try {
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: content,
                        history: chatHistory.slice(-20, -1),
                        image: currentImage
                    })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Process complete SSE messages
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                handleStreamData(data, thinkingContentEl);
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
                
                // Process remaining buffer
                if (buffer.startsWith('data: ')) {
                    try {
                        const data = JSON.parse(buffer.slice(6));
                        handleStreamData(data, thinkingContentEl);
                    } catch (e) {}
                }
                
            } catch (error) {
                console.error('Stream error:', error);
                document.getElementById('answerContent').innerHTML = `<span style="color: var(--error);">请求失败: ${error.message}</span>`;
            }
            
            // Finish
            finishStream();
        }
        
        // Handle stream data
        function handleStreamData(data, thinkingContentEl) {
            if (data.type === 'thinking') {
                // Update thinking content with typewriter effect
                thinkingContent = data.content;
                thinkingContentEl.textContent = thinkingContent;
                scrollToBottom();
            } else if (data.type === 'answer') {
                // Update answer content
                answerContent = data.content;
                const answerEl = document.getElementById('answerContent');
                if (answerEl) {
                    answerEl.textContent = answerContent;
                }
                scrollToBottom();
            } else if (data.type === 'done') {
                // Final answer from thinking extraction
                if (data.answer && !answerContent) {
                    answerContent = data.answer;
                    const answerEl = document.getElementById('answerContent');
                    if (answerEl) {
                        answerEl.textContent = answerContent;
                    }
                }
            } else if (data.type === 'error') {
                const answerEl = document.getElementById('answerContent');
                if (answerEl) {
                    answerEl.innerHTML = `<span style="color: var(--error);">错误: ${data.error}</span>`;
                }
            }
        }
        
        // Finish streaming
        function finishStream() {
            isStreaming = false;
            setInputEnabled(true);
            
            // Hide thinking dots, keep content
            const thinkingContainer = document.getElementById('thinkingContainer');
            if (thinkingContainer) {
                thinkingContainer.classList.remove('streaming');
                thinkingContainer.classList.add('idle');
            }
            
            // Save to history
            chatHistory.push({
                role: 'assistant',
                content: answerContent || thinkingContent,
                preview: (answerContent || thinkingContent).substring(0, 30)
            });
            saveHistory();
            updateChatHistoryUI();
            
            messageInput.focus();
        }
        
        // Scroll to bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Set input enabled/disabled
        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            const attachBtn = document.querySelector('.attach-btn');
            if (attachBtn) attachBtn.disabled = !enabled;
        }
        
        // Show help
        function showHelp() {
            alert('工业视觉检测AI专家 v1.0\n\n功能说明：\n1. 支持文字和图片输入\n2. 实时显示思考过程\n3. 相机、光源、代码快速生成\n4. 缺陷分析与方案设计\n\n快捷键：\n- Enter: 发送消息\n- Shift+Enter: 换行');
        }
    </script>
</body>
</html>
